upstream fastapi       { server backend:8000; }
upstream onlyoffice_ds { server onlyoffice:80; }
upstream pgadmin_app   { server pgadmin:80; }

# ใช้ X-Forwarded-Proto ที่ส่งมาจาก proxy ชั้นนอก (เช่น AWS LB ที่ terminate TLS) ถ้ามี
# ถ้าไม่มี (เช่น เข้าตรงผ่าน http://localhost ตอน dev) ให้ fallback ไปตาม scheme จริงของ request นี้
map $http_x_forwarded_proto $proxied_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 500M;

    location /pgadmin/ {
        proxy_pass http://pgadmin_app;
        proxy_set_header X-Script-Name     /pgadmin;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $proxied_proto;
    }

    location = /onlyoffice { return 301 /onlyoffice/; }

    location /onlyoffice/ {
        proxy_pass http://onlyoffice_ds/;
        proxy_redirect http://onlyoffice:80/ /onlyoffice/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $proxied_proto;
        proxy_read_timeout 3600;
    }

    location ~ ^/([0-9]+\.[0-9]+\.[0-9]+-[0-9a-f]+/)?(welcome|web-apps|sdkjs|fonts|info|healthcheck|cache|converter|doceditor|doc)/ {
        proxy_pass http://onlyoffice_ds;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $proxied_proto;
        proxy_read_timeout 3600;
    }

    # ป้องกัน browser cache HTML → ทุก deploy ให้โหลดไฟล์ใหม่เสมอ
    location ~* \.html$ {
        proxy_pass http://fastapi;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $proxied_proto;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # รวมไฟล์เป็น PDF ต้องรอ OnlyOffice แปลงทีละไฟล์ อาจใช้เวลานานกว่า request ทั่วไป
    # (nginx default proxy_read_timeout คือ 60s ซึ่งไม่พอ ทำให้เจอ 504 Gateway Time-out)
    location /api/combine-to-pdf {
        proxy_pass http://fastapi;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $proxied_proto;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location / {
        proxy_pass http://fastapi;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $proxied_proto;
    }
}
