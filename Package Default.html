<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>QAQC | Default Package</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(to bottom right, #f0f8ff, #eaf2f8);
      min-height: 100vh;
    }

    .header {
      background: linear-gradient(to right, #d6eaf8, #aed6f1);
      padding: 28px 40px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .logo-container {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
    }

    .logo {
      height: 50px;
      margin-bottom: 4px;
    }

    .company-name {
      font-size: 13px;
      font-style: italic;
      color: #2c3e50;
    }

    .center-title {
      flex: 1;
      text-align: center;
      font-size: 28px;
      font-weight: bold;
      color: #154360;
    }

    /* HEADER NAV (right side inside header) */
    .header-nav {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      width: 360px;
      flex-shrink: 0;
      min-width: 0;
    }

    .hn-label {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      font-weight: 600;
      color: #154360;
      cursor: pointer;
      padding: 7px 16px;
      background: rgba(255, 255, 255, 0.55);
      border: 1px solid rgba(255, 255, 255, 0.85);
      border-radius: 20px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.08);
      transition: background 0.2s, box-shadow 0.2s;
      user-select: none;
    }

    .hn-label:hover {
      background: rgba(255, 255, 255, 0.85);
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.12);
    }

    .hn-label .hn-arrow {
      font-size: 10px;
      transition: transform 0.25s;
    }

    .hn-label.open .hn-arrow {
      transform: rotate(180deg);
    }

    .hn-grid {
      position: absolute;
      top: calc(100% + 10px);
      right: 0;
      z-index: 20;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      width: 100%;
      padding: 10px;
      background: rgba(255, 255, 255, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.85);
      border-radius: 12px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.18);
    }

    .hn-item {
      display: flex;
      align-items: center;
      gap: 3px;
      min-width: 0;
    }

    .hn-btn {
      flex: 1;
      min-width: 0;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 8px 10px;
      background: rgba(255, 255, 255, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.9);
      border-radius: 8px;
      color: #154360;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, transform 0.15s, box-shadow 0.2s;
      overflow: hidden;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    .hn-btn:hover {
      background: #ffffff;
      transform: translateY(-2px);
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.12);
    }

    .hn-btn .btn-icon {
      font-size: 14px;
      flex-shrink: 0;
    }

    .hn-btn .btn-text {
      white-space: nowrap;
      min-width: 0;
    }

    @media (max-width: 900px) {
      .header-nav { display: none; }
    }

    .content {
      max-width: 900px;
      margin: 30px auto;
      text-align: center;
    }

    .breadcrumb {
      text-align: left;
      margin-bottom: 20px;
      font-size: 14px;
      color: #34495e;
    }

    .breadcrumb a {
      text-decoration: none;
      color: #2980b9;
    }

    h2 {
      margin-bottom: 40px;
    }

    .grid-buttons {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 40px;
      justify-content: center;
    }

    .section-button {
      background: linear-gradient(to right, #5dade2, #3498db);
      color: white;
      font-size: 20px;
      padding: 40px 20px;
      border: none;
      border-radius: 16px;
      cursor: pointer;
      transition: transform 0.2s;
      box-shadow: 0 6px 12px rgba(0, 0, 0, 0.15);
    }

    .section-button:hover {
      transform: translateY(-5px);
      background: linear-gradient(to right, #2e86c1, #2471a3);
    }
  </style>
</head>
<body>

  <!-- Header -->
  <div class="header">
    <div class="logo-container">
      <img src="GCME_Logo.png" alt="Company Logo" class="logo">
      <div class="company-name">GC Maintenance and Engineering Co.,LTD.</div>
    </div>
    <div class="center-title">ME SMART</div>

    <!-- Navigation (inside header, right side) -->
    <div class="header-nav">
      <div class="hn-label" id="hnLabel" onclick="toggleBox()">
        <span>General Form</span>
        <span class="hn-arrow">▾</span>
      </div>
      <div id="myBox" class="hn-grid" style="display: none;">
        <div class="hn-item">
          <button class="hn-btn" onclick="location.href='MaintenanceReport.html' + location.search">
            <span class="btn-icon">🔧</span>
            <span class="btn-text">Maintenance Report</span>
          </button>
        </div>
        <div class="hn-item">
          <button class="hn-btn" onclick="location.href='InspectionReport.html' + location.search">
            <span class="btn-icon">🔍</span>
            <span class="btn-text">Inspection Report</span>
          </button>
        </div>
        <div class="hn-item">
          <button class="hn-btn" onclick="location.href='SparePartReport.html' + location.search">
            <span class="btn-icon">⚙️</span>
            <span class="btn-text">Spare Part Report</span>
          </button>
        </div>
        <div class="hn-item">
          <button class="hn-btn" onclick="location.href='PhotographerReport.html' + location.search">
            <span class="btn-icon">📷</span>
            <span class="btn-text">Photographer Report</span>
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Main Content -->
  <div class="content">
    <div class="breadcrumb" id="breadcrumb"></div>

    <h2><span id="package-name">...</span></h2>

    <div class="grid-buttons">
      <button class="section-button"><a href="Data.html">Data</a></button>
      <button class="section-button"><a href="Progress.html">Progress</a></button>
      <button class="section-button"><a href="QAQC Step.html">QAQC Step</a></button>
      <button class="section-button"><a href="Report_Demo.html">Report</a></button>
    </div>
  </div>

  <!-- Script -->
  <script>
    function toggleBox() {
      const element = document.getElementById('myBox');
      const label = document.getElementById('hnLabel');

      if (element.style.display === 'none') {
        element.style.display = 'grid'; // แสดง
        label.classList.add('open');
      } else {
        element.style.display = 'none';  // ซ่อน
        label.classList.remove('open');
      }
    }

    const API_BASE = '/api';
    const urlParams = new URLSearchParams(window.location.search);
    const company = urlParams.get("company") || "";
    const plant   = urlParams.get("plant")   || "";
    const service = urlParams.get("service") || "";
    const pkg     = urlParams.get("package") || "";

    async function ensurePath(path) {
      try {
        await fetch(`${API_BASE}/ensure-path`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ path })
        });
      } catch (e) {
        console.warn('ensurePath failed:', path, e);
      }
    }

    // Auto-create folder ใน MinIO เมื่อโหลดหน้า
    if (company && plant && pkg) ensurePath(`${company}/${plant}/${service}/${pkg}/`);

    // Breadcrumb: Home > Company > Plant > Service > Package
    document.getElementById("breadcrumb").innerHTML = `
      <a href="Main.html">Home</a> &gt;
      <a href="Plant Selection.html?plant=${encodeURIComponent(company)}">${company}</a> &gt;
      <a href="Service.html?company=${encodeURIComponent(company)}&plant=${encodeURIComponent(plant)}">${plant}</a> &gt;
      <a href="Package Selection.html?company=${encodeURIComponent(company)}&plant=${encodeURIComponent(plant)}&service=${encodeURIComponent(service)}">${service}</a> &gt;
      <span>${pkg}</span>
    `;

    document.getElementById("package-name").textContent = `${company} / ${plant} / ${service} / ${pkg}`;

    // ส่ง context ครบไปทุกปุ่ม
    const params = new URLSearchParams({ company, plant, service, package: pkg });
    document.querySelectorAll(".section-button a").forEach(a => {
      const page = a.getAttribute("href");
      a.setAttribute("href", `${page}?${params.toString()}`);
    });
  </script>

</body>
</html>
