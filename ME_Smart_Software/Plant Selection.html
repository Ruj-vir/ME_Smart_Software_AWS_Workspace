<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>QAQC ONLINE APPLICATION</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(to bottom right, #f0f8ff, #eaf2f8);
      min-height: 100vh;
    }

    .header {
      background: linear-gradient(to right, #d6eaf8, #aed6f1);
      padding: 20px 40px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .logo-container {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
    }

    .logo {
      height: 50px;
      margin-bottom: 4px;
    }

    .company-name {
      font-size: 13px;
      font-style: italic;
      color: #2c3e50;
    }

    .center-title {
      flex: 1;
      text-align: center;
      font-size: 28px;
      font-weight: bold;
      color: #154360;
      margin-right: 100px;
    }

    .content {
      max-width: 900px;
      margin: 30px auto;
      text-align: center;
    }

    .button-list {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 20px;
      margin-top: 40px;
    }

    .custom-button {
      background: linear-gradient(to right, #5dade2, #3498db);
      color: white;
      padding: 30px 20px;
      font-size: 20px;
      border: none;
      border-radius: 14px;
      min-width: 180px;
      cursor: pointer;
      position: relative;
      box-shadow: 0 6px 12px rgba(0,0,0,0.15);
      transition: transform 0.2s;
    }

    .custom-button:hover {
      transform: translateY(-4px);
    }

    .button-actions {
      position: absolute;
      top: 5px;
      right: 8px;
      display: flex;
      gap: 5px;
    }

    .action-btn {
      background: rgba(255, 255, 255, 0.7);
      border: none;
      padding: 2px 6px;
      font-size: 12px;
      border-radius: 4px;
      cursor: pointer;
    }

    .add-btn {
      background-color: #27ae60;
      color: white;
      padding: 15px 30px;
      font-size: 20px;
      border: none;
      border-radius: 14px;
      margin-top: 30px;
      cursor: pointer;
      box-shadow: 0 6px 12px rgba(0,0,0,0.1);
    }

    .add-btn:hover {
      background-color: #219150;
    }

    input.rename-input {
      font-size: 16px;
      border: none;
      border-radius: 6px;
      padding: 4px 8px;
      text-align: center;
      width: 90%;
    }

    .modal {
      display: none;
      position: fixed;
      z-index: 100;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      overflow: auto;
      background-color: rgba(0, 0, 0, 0.4);
    }

    .modal-content {
      background-color: #fff;
      margin: 15% auto;
      padding: 20px 30px;
      border-radius: 12px;
      width: 300px;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
    }

    .modal input {
      width: 100%;
      padding: 10px;
      font-size: 16px;
      margin: 15px 0;
    }

    .modal button {
      padding: 10px 20px;
      font-size: 16px;
      margin: 5px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }

    .btn-confirm {
      background-color: #3498db;
      color: white;
    }

    .btn-cancel {
      background-color: #ccc;
      color: #333;
    }
  </style>
</head>
<body>

  <!-- Header -->
  <div class="header">
    <div class="logo-container">
      <img src="GCME_Logo.png" alt="Company Logo" class="logo">
      <div class="company-name">GC Maintenance and Engineering Co.,LTD.</div>
    </div>
    <div class="center-title">ME SMART</div>
  </div>

  <!-- Main Content -->
  <div class="content">
    <div id="breadcrumb" style="text-align: left; margin-bottom: 20px; font-size: 14px; color: #34495e;"></div>
    <h2>Select Your Plant</h2>
    <div class="button-list" id="buttonList">
      <!-- Dynamic buttons -->
    </div>
    <button class="add-btn" onclick="showModal()">+ Add plant</button>
  </div>

  <!-- Modal Input -->
  <div id="addModal" class="modal">
    <div class="modal-content">
      <h3>Enter Plant Name</h3>
      <input type="text" id="newButtonLabel" placeholder="Please Fill-in your plant name">
      <div>
        <button class="btn-confirm" onclick="createButton()">Create</button>
        <button class="btn-cancel" onclick="closeModal()">Cancel</button>
      </div>
    </div>
  </div>

  <script>
    const API_BASE = '/api';
    const buttonList = document.getElementById("buttonList");
    const modal = document.getElementById("addModal");
    const input = document.getElementById("newButtonLabel");

    // ดึงชื่อ company จาก URL ที่ module level (ใช้ร่วมกันทุก function)
    const cleintName = new URLSearchParams(window.location.search).get("plant") || "Client";

    async function ensurePath(path) {
      try {
        await fetch(`${API_BASE}/ensure-path`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ path })
        });
      } catch (e) {
        console.warn('ensurePath failed:', path, e);
      }
    }

    async function deletePath(path) {
      try {
        await fetch(`${API_BASE}/delete-path?path=${encodeURIComponent(path)}`, {
          method: 'DELETE'
        });
      } catch (e) {
        console.warn('deletePath failed:', path, e);
      }
    }

    async function renamePath(oldPath, newPath, onFail) {
      try {
        const res = await fetch(`${API_BASE}/rename-path`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ old_path: oldPath, new_path: newPath })
        });
        if (!res.ok) {
          console.warn('renamePath server error:', res.status);
          if (onFail) onFail();
        }
      } catch (e) {
        console.warn('renamePath failed:', oldPath, '->', newPath, e);
        if (onFail) onFail();
      }
    }

    function showModal() {
      modal.style.display = "block";
      input.value = "";
      input.focus();
    }

    function closeModal() {
      modal.style.display = "none";
    }

    window.onclick = function(event) {
      if (event.target == modal) closeModal();
    }

    function createButton() {
      const label = input.value.trim();
      if (!label) {
        alert("Please enter a button name.");
        return;
      }
      addNewButton(label);
      ensurePath(`${cleintName}/${label}/`);
      closeModal();
    }

    function addNewButton(label = "New Button") {
      let currentLabel = label;

      const wrapper = document.createElement("div");
      wrapper.className = "custom-button";
      wrapper.style.position = "relative";

      const span = document.createElement("span");
      span.textContent = currentLabel;

      wrapper.onclick = () => {
        window.location.href = `Service.html?company=${encodeURIComponent(cleintName)}&plant=${encodeURIComponent(currentLabel)}`;
      };

      const actions = document.createElement("div");
      actions.className = "button-actions";

      const editBtn = document.createElement("button");
      editBtn.className = "action-btn";
      editBtn.innerHTML = "✏️";
      editBtn.onclick = (event) => {
        event.stopPropagation();
        renameButton(span, actions, editBtn, deleteBtn, async (newLabel, revertFn) => {
          if (!newLabel || newLabel === currentLabel) return;
          const oldLabel = currentLabel;
          currentLabel = newLabel;
          await renamePath(
            `${cleintName}/${oldLabel}`,
            `${cleintName}/${newLabel}`,
            () => {
              currentLabel = oldLabel;
              revertFn(oldLabel);
              alert(`ไม่สามารถเปลี่ยนชื่อเป็น "${newLabel}" ได้ กรุณาลองอีกครั้ง`);
            }
          );
        });
      };

      const deleteBtn = document.createElement("button");
      deleteBtn.className = "action-btn";
      deleteBtn.innerHTML = "🗑️";
      deleteBtn.onclick = async (event) => {
        event.stopPropagation();
        if (!confirm(`ลบ "${currentLabel}" และทุกไฟล์ข้างในออกจาก MinIO?`)) return;
        await deletePath(`${cleintName}/${currentLabel}/`);
        wrapper.remove();
      };

      actions.appendChild(editBtn);
      actions.appendChild(deleteBtn);

      wrapper.appendChild(actions);
      wrapper.appendChild(span);
      buttonList.appendChild(wrapper);
    }

    function renameButton(span, actions, editBtn, deleteBtn, onRename) {
      const oldText = span.textContent;
      const inputEl = document.createElement("input");
      inputEl.className = "rename-input";
      inputEl.type = "text";
      inputEl.value = oldText;

      // swap ปุ่ม ✏️🗑️ → ✅❌
      const confirmBtn = document.createElement("button");
      confirmBtn.className = "action-btn";
      confirmBtn.innerHTML = "✅";
      confirmBtn.title = "Confirm";

      const cancelBtn = document.createElement("button");
      cancelBtn.className = "action-btn";
      cancelBtn.innerHTML = "❌";
      cancelBtn.title = "Cancel";

      actions.innerHTML = "";
      actions.appendChild(confirmBtn);
      actions.appendChild(cancelBtn);

      span.replaceWith(inputEl);
      inputEl.focus();

      function restoreActions() {
        actions.innerHTML = "";
        actions.appendChild(editBtn);
        actions.appendChild(deleteBtn);
      }

      async function doConfirm() {
        const newText = inputEl.value.trim() || oldText;
        const newSpan = document.createElement("span");
        newSpan.textContent = newText;
        inputEl.replaceWith(newSpan);
        restoreActions();
        if (newText !== oldText && onRename) {
          await onRename(newText, (revertText) => { newSpan.textContent = revertText; });
        }
      }

      function doCancel() {
        const newSpan = document.createElement("span");
        newSpan.textContent = oldText;
        inputEl.replaceWith(newSpan);
        restoreActions();
      }

      confirmBtn.onclick = (e) => { e.stopPropagation(); doConfirm(); };
      cancelBtn.onclick  = (e) => { e.stopPropagation(); doCancel(); };

      inputEl.onkeydown = (e) => {
        if (e.key === 'Enter')  { e.preventDefault(); doConfirm(); }
        if (e.key === 'Escape') { doCancel(); }
      };
    }

    // Generate content based on plant name
    window.addEventListener("DOMContentLoaded", async () => {

      document.getElementById("breadcrumb").innerHTML = `
        <a href="Main.html" style="text-decoration: none; color: #2980b9;">Home</a> &gt; ${cleintName}
      `;

      const mainTitle = document.querySelector("h2");
      if (mainTitle) mainTitle.textContent = `Please Select Area - ${cleintName}`;

      // โหลดเฉพาะ folder ที่มีจริงใน MinIO
      try {
        const res = await fetch(`${API_BASE}/list-paths?prefix=${encodeURIComponent(cleintName)}`);
        const { folders } = await res.json();
        folders.forEach(label => addNewButton(label));
      } catch (e) {
        console.warn("ไม่สามารถโหลด folder จาก MinIO:", e);
      }
    });
  </script>

</body>
</html>
