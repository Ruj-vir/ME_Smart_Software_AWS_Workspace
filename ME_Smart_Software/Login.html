<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>QAQC ONLINE APPLICATION</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(to bottom right, #f0f8ff, #eaf2f8);
      min-height: 100vh;
    }

    .header {
      background: linear-gradient(to right, #d6eaf8, #aed6f1);
      padding: 20px 40px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .logo-container {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
    }

    .logo {
      height: 50px;
      margin-bottom: 4px;
    }

    .company-name {
      font-size: 13px;
      font-style: italic;
      color: #2c3e50;
    }

    .center-title {
      flex: 1;
      text-align: center;
      font-size: 28px;
      font-weight: bold;
      color: #154360;
      margin-right: 100px;
    }

    .content {
      max-width: 900px;
      margin: 60px auto;
      text-align: center;
    }

    .login-card {
      background: white;
      border-radius: 16px;
      padding: 40px 50px;
      max-width: 420px;
      margin: 0 auto;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.12);
    }

    .login-card h2 {
      font-size: 22px;
      color: #154360;
      margin-bottom: 28px;
    }

    .form-group {
      text-align: left;
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      font-size: 14px;
      font-weight: 600;
      color: #34495e;
      margin-bottom: 6px;
    }

    .form-group input {
      width: 100%;
      padding: 12px 14px;
      font-size: 15px;
      border: 1.5px solid #aed6f1;
      border-radius: 8px;
      outline: none;
      transition: border-color 0.2s;
    }

    .form-group input:focus {
      border-color: #3498db;
    }

    .login-btn {
      background: linear-gradient(to right, #5dade2, #3498db);
      color: white;
      width: 100%;
      padding: 14px;
      font-size: 17px;
      font-weight: 600;
      border: none;
      border-radius: 10px;
      margin-top: 10px;
      cursor: pointer;
      box-shadow: 0 6px 12px rgba(52, 152, 219, 0.3);
      transition: transform 0.2s;
    }

    .login-btn:hover {
      transform: translateY(-2px);
    }

    .error-msg {
      color: #e74c3c;
      font-size: 13px;
      margin-top: 12px;
      display: none;
    }

    .modal {
      display: none;
      position: fixed;
      z-index: 100;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      overflow: auto;
      background-color: rgba(0, 0, 0, 0.4);
    }

    .modal-content {
      background-color: #fff;
      margin: 15% auto;
      padding: 20px 30px;
      border-radius: 12px;
      width: 300px;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
    }

    .modal-content p {
      font-size: 15px;
      color: #e74c3c;
      margin-bottom: 16px;
    }

    .modal button {
      padding: 10px 20px;
      font-size: 16px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      background-color: #3498db;
      color: white;
    }
  </style>
</head>
<body>

  <!-- Header -->
  <div class="header">
    <div class="logo-container">
      <img src="GCME_Logo.png" alt="Company Logo" class="logo">
      <div class="company-name">GC Maintenance and Engineering Co.,LTD.</div>
    </div>
    <div class="center-title">ME SMART</div>
  </div>

  <!-- Main Content -->
  <div class="content">
    <div class="login-card">
      <h2>Sign In</h2>
      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" placeholder="Enter your username" autocomplete="username">
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Enter your password" autocomplete="current-password">
      </div>
      <button class="login-btn" onclick="handleLogin()">Login</button>
      <div class="error-msg" id="errorMsg">Invalid username or password. Please try again.</div>
    </div>
  </div>

  <!-- Error Modal -->
  <div id="errorModal" class="modal">
    <div class="modal-content">
      <h3>Login Failed</h3>
      <p id="modalErrorText">Invalid username or password.</p>
      <button onclick="closeModal()">OK</button>
    </div>
  </div>

  <script>
    const API_BASE = '/api';

    async function handleLogin() {
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;

      if (!username || !password) {
        showModal('Please enter both username and password.');
        return;
      }

      try {
        const res = await fetch(`${API_BASE}/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });

        if (res.ok) {
          const data = await res.json();
          window.location.href = `Main.html`;
        } else {
          showModal('Invalid username or password. Please try again.');
        }
      } catch (e) {
        console.warn('Login request failed:', e);
        showModal('Cannot connect to server. Please try again later.');
      }
    }

    function showModal(message) {
      document.getElementById('modalErrorText').textContent = message;
      document.getElementById('errorModal').style.display = 'block';
    }

    function closeModal() {
      document.getElementById('errorModal').style.display = 'none';
    }

    window.onclick = function(event) {
      const modal = document.getElementById('errorModal');
      if (event.target === modal) closeModal();
    };

    document.addEventListener('keydown', function(e) {
      if (e.key === 'Enter') handleLogin();
    });
  </script>

</body>
</html>
