<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Report Management - ME SMART</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(to bottom right, #f0f8ff, #eaf2f8);
      min-height: 100vh;
    }

    /* ===== HEADER (same as template) ===== */
    .header {
      background: linear-gradient(to right, #d6eaf8, #aed6f1);
      padding: 28px 40px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .logo-container {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
    }

    .logo {
      height: 50px;
      margin-bottom: 4px;
    }

    .company-name {
      font-size: 13px;
      font-style: italic;
      color: #2c3e50;
    }

    .center-title {
      flex: 1;
      text-align: center;
      font-size: 28px;
      font-weight: bold;
      color: #154360;
    }

    /* HEADER NAV (right side inside header) */
    .header-nav {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      width: 360px;
      flex-shrink: 0;
      min-width: 0;
    }

    .hn-label {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      font-weight: 600;
      color: #154360;
      cursor: pointer;
      padding: 7px 16px;
      background: rgba(255, 255, 255, 0.55);
      border: 1px solid rgba(255, 255, 255, 0.85);
      border-radius: 20px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.08);
      transition: background 0.2s, box-shadow 0.2s;
      user-select: none;
    }

    .hn-label:hover {
      background: rgba(255, 255, 255, 0.85);
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.12);
    }

    .hn-label .hn-arrow {
      font-size: 10px;
      transition: transform 0.25s;
    }

    .hn-label.open .hn-arrow {
      transform: rotate(180deg);
    }

    .hn-grid {
      position: absolute;
      top: calc(100% + 10px);
      right: 0;
      z-index: 20;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      width: 100%;
      padding: 10px;
      background: rgba(255, 255, 255, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.85);
      border-radius: 12px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.18);
    }

    .hn-item {
      display: flex;
      align-items: center;
      gap: 3px;
      min-width: 0;
    }

    .hn-btn {
      flex: 1;
      min-width: 0;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 8px 10px;
      background: rgba(255, 255, 255, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.9);
      border-radius: 8px;
      color: #154360;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, transform 0.15s, box-shadow 0.2s;
      overflow: hidden;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    .hn-btn:hover {
      background: #ffffff;
      transform: translateY(-2px);
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.12);
    }

    .hn-btn .btn-icon {
      font-size: 14px;
      flex-shrink: 0;
    }

    .hn-btn .btn-text {
      white-space: nowrap;
      min-width: 0;
    }

    @media (max-width: 900px) {
      .header-nav { display: none; }
    }

    /* ===== MAIN CONTENT ===== */
    .content {
      max-width: 1100px;
      margin: 30px auto;
      padding: 0 20px;
    }

    /* Breadcrumb */
    #breadcrumb {
      text-align: left;
      margin-bottom: 16px;
      font-size: 14px;
      color: #34495e;
    }

    #breadcrumb a {
      text-decoration: none;
      color: #2980b9;
    }

    /* Page title */
    .page-title {
      font-size: 32px;
      font-weight: bold;
      color: #1a252f;
      margin-bottom: 28px;
    }

    /* ===== FILTER BAR ===== */
    .filter-bar {
      display: flex;
      gap: 12px;
      margin-bottom: 28px;
      flex-wrap: wrap;
    }

    .filter-bar select,
    .filter-bar input {
      padding: 12px 16px;
      font-size: 15px;
      border: 1.5px solid #c8d8e8;
      border-radius: 10px;
      background: white;
      color: #2c3e50;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
      flex: 1;
      min-width: 140px;
    }

    .filter-bar select:focus,
    .filter-bar input:focus {
      border-color: #3498db;
      box-shadow: 0 0 0 3px rgba(52, 152, 219, 0.15);
    }

    .filter-bar .btn-search {
      background: linear-gradient(to right, #5dade2, #3498db);
      color: white;
      border: none;
      border-radius: 10px;
      padding: 12px 28px;
      font-size: 15px;
      cursor: pointer;
      white-space: nowrap;
      transition: transform 0.15s, box-shadow 0.15s;
      box-shadow: 0 4px 10px rgba(52, 152, 219, 0.3);
    }

    .filter-bar .btn-search:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 14px rgba(52, 152, 219, 0.4);
    }

    /* ===== TWO PANELS ===== */
    .panels {
      display: grid;
      grid-template-columns: 1fr 2fr;
      gap: 20px;
      margin-bottom: 28px;
    }

    .panel {
      background: white;
      border-radius: 16px;
      border: 1.5px solid #d4e6f1;
      padding: 24px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.06);
    }

    .panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 6px;
    }

    .panel-title {
      font-size: 20px;
      font-weight: 700;
      color: #1a252f;
      margin-bottom: 6px;
    }

    .panel-header .panel-title {
      font-size: 13px;
      margin-bottom: 0;
    }

    .btn-generate {
      background: linear-gradient(to right, #5dade2, #3498db);
      color: white;
      border: none;
      border-radius: 20px;
      padding: 9px 22px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
      box-shadow: 0 4px 10px rgba(52, 152, 219, 0.35);
      transition: transform 0.15s, box-shadow 0.15s, background 0.2s;
    }

    .btn-generate:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 14px rgba(52, 152, 219, 0.45);
      background: linear-gradient(to right, #4fa8de, #2e86c1);
    }

    .panel-subtitle {
      font-size: 13px;
      color: #7f8c8d;
      margin-bottom: 22px;
    }

    .report-type-label {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 15px;
      font-weight: 600;
      color: #2c3e50;
      margin-bottom: 14px;
      cursor: pointer;
      user-select: none;
    }

    .report-type-label .rt-arrow {
      font-size: 20px;
      font-weight: 700;
      color: #3498db;
      transform: rotate(-90deg);
      transition: transform 0.25s;
    }

    .report-type-label.open .rt-arrow {
      transform: rotate(0deg);
    }

    .check-list {
      display: none;
    }

    .check-list.open {
      display: block;
    }

    .check-row.type-row {
      cursor: pointer;
      user-select: none;
    }

    .check-row .row-arrow {
      margin-left: auto;
      font-size: 14px;
      font-weight: 700;
      color: #3498db;
      transform: rotate(-90deg);
      transition: transform 0.2s;
      flex-shrink: 0;
    }

    .check-row.type-row.open .row-arrow {
      transform: rotate(0deg);
    }

    .file-sublist {
      display: none;
      padding: 2px 0 10px 30px;
    }

    .file-sublist.open {
      display: block;
    }

    .file-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 6px 0;
      font-size: 13px;
      color: #34495e;
    }

    .file-row input[type="checkbox"] {
      width: 15px;
      height: 15px;
      accent-color: #3498db;
      cursor: pointer;
      flex-shrink: 0;
    }

    .file-row .file-name {
      flex: 1;
      min-width: 0;
      cursor: pointer;
      color: #2980b9;
      text-decoration: underline;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .file-row .file-date {
      font-size: 11px;
      color: #95a5a6;
      flex-shrink: 0;
      white-space: nowrap;
    }

    .file-loading, .file-empty {
      font-size: 12px;
      color: #95a5a6;
      padding: 6px 0;
    }

    /* Checkbox rows */
    .check-row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 0;
      border-bottom: 1px solid #eaf2f8;
    }

    .check-row:last-child {
      border-bottom: none;
    }

    .check-row input[type="checkbox"] {
      width: 18px;
      height: 18px;
      accent-color: #3498db;
      cursor: pointer;
      flex-shrink: 0;
    }

    .check-row label {
      font-size: 15px;
      color: #2c3e50;
      flex: 1;
      cursor: pointer;
    }

    /* ===== PREVIEW PANEL ===== */
    .preview-panel .panel-title {
      margin-bottom: 18px;
    }

    .preview-box {
      border: 1.5px solid #d4e6f1;
      border-radius: 12px;
      min-height: 380px;
      background: #f8fbff;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }

    .preview-box img {
      max-width: 100%;
      max-height: 380px;
      object-fit: contain;
      border-radius: 8px;
      opacity: 0.9;
    }

    .preview-badge {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(180, 140, 220, 0.82);
      color: white;
      font-size: 18px;
      font-weight: 600;
      padding: 10px 28px;
      border-radius: 8px;
      pointer-events: none;
      letter-spacing: 0.3px;
    }

    .preview-placeholder {
      color: #aab8c4;
      font-size: 15px;
      text-align: center;
      padding: 20px;
    }

    .preview-placeholder svg {
      display: block;
      margin: 0 auto 12px;
      opacity: 0.4;
    }

    /* ===== BOTTOM ACTION BUTTONS ===== */
    .action-bar {
      display: flex;
      justify-content: center;
      gap: 16px;
      flex-wrap: wrap;
      padding-bottom: 40px;
    }

    .btn-action {
      background: white;
      color: #1a252f;
      border: 1.5px solid #c8d8e8;
      border-radius: 12px;
      padding: 14px 36px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0,0,0,0.08);
      transition: transform 0.15s, box-shadow 0.15s, background 0.2s;
      min-width: 180px;
    }

    .btn-action:hover {
      transform: translateY(-3px);
      box-shadow: 0 7px 18px rgba(0,0,0,0.12);
      background: #f0f8ff;
    }

    .btn-action.primary {
      background: linear-gradient(to right, #5dade2, #3498db);
      color: white;
      border-color: transparent;
      box-shadow: 0 4px 12px rgba(52, 152, 219, 0.35);
    }

    .btn-action.primary:hover {
      box-shadow: 0 7px 18px rgba(52, 152, 219, 0.45);
      background: linear-gradient(to right, #4fa8de, #2e86c1);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 720px) {
      .panels {
        grid-template-columns: 1fr;
      }
      .center-title {
        font-size: 20px;
        margin-right: 0;
      }
    }
  </style>
</head>
<body>

  <!-- Header (same as template) -->
  <div class="header">
    <div class="logo-container">
      <img src="GCME_Logo.png" alt="Company Logo" class="logo">
      <div class="company-name">GC Maintenance and Engineering Co.,LTD.</div>
    </div>
    <div class="center-title">ME SMART</div>

    <!-- Navigation (inside header, right side) -->
    <div class="header-nav">
      <div class="hn-label" id="hnLabel" onclick="toggleBox()">
        <span>General Form</span>
        <span class="hn-arrow">▾</span>
      </div>
      <div id="myBox" class="hn-grid" style="display: none;">
        <div class="hn-item">
          <button class="hn-btn" onclick="location.href='MaintenanceReport.html' + location.search">
            <span class="btn-icon">🔧</span>
            <span class="btn-text">Maintenance Report</span>
          </button>
        </div>
        <div class="hn-item">
          <button class="hn-btn" onclick="location.href='InspectionReport.html' + location.search">
            <span class="btn-icon">🔍</span>
            <span class="btn-text">Inspection Report</span>
          </button>
        </div>
        <div class="hn-item">
          <button class="hn-btn" onclick="location.href='SparePartReport.html' + location.search">
            <span class="btn-icon">⚙️</span>
            <span class="btn-text">Spare Part Report</span>
          </button>
        </div>
        <div class="hn-item">
          <button class="hn-btn" onclick="location.href='PhotographerReport.html' + location.search">
            <span class="btn-icon">📷</span>
            <span class="btn-text">Photographer Report</span>
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Main Content -->
  <div class="content">

    <!-- Breadcrumb -->
    <div id="breadcrumb"></div>

    <!-- Page Title -->
    <div class="page-title">Report Management</div>

    <!-- Filter Bar -->
    <div class="filter-bar">
      <select id="filterProject">
        <option value="">Project</option>
      </select>
      <select id="filterDate">
        <option value="">Date</option>
      </select>
      <input type="text" id="filterEquipment" placeholder="Equipment">
      <input type="text" id="filterStatus" placeholder="Status">
      <button class="btn-search" onclick="handleSearch()">Search</button>
    </div>

    <!-- Two Panels -->
    <div class="panels">

      <!-- LEFT: Report Builder -->
      <div class="panel">
        <div class="panel-header">
          <div class="panel-title">Document List</div>
          <button class="btn-generate" onclick="generateReport()">Generate Report</button>
        </div>
        <!-- <div class="panel-subtitle">Using data from maintenance record</div> -->

        <div class="report-type-label" id="mrToggle" onclick="toggleRecordList()">
          <span class="rt-arrow" id="mrArrow">▾</span>
          <span>Maintenance Record</span>
        </div>

        <div class="check-list" id="mrList">
          <div class="report-item">
            <div class="check-row type-row" onclick="toggleFileGroup('maintenance', event)">
              <label>Maintenance Report</label>
              <span class="row-arrow">▾</span>
            </div>
            <div class="file-sublist" id="files-maintenance"></div>
          </div>

          <div class="report-item">
            <div class="check-row type-row" onclick="toggleFileGroup('inspection', event)">
              <label>Inspection Report</label>
              <span class="row-arrow">▾</span>
            </div>
            <div class="file-sublist" id="files-inspection"></div>
          </div>

          <div class="report-item">
            <div class="check-row type-row" onclick="toggleFileGroup('sparepart', event)">
              <label>Spare Part Report</label>
              <span class="row-arrow">▾</span>
            </div>
            <div class="file-sublist" id="files-sparepart"></div>
          </div>

          <div class="report-item">
            <div class="check-row type-row" onclick="toggleFileGroup('photographer', event)">
              <label>Photographer Report</label>
              <span class="row-arrow">▾</span>
            </div>
            <div class="file-sublist" id="files-photographer"></div>
          </div>
        </div>
      </div>

      <!-- RIGHT: Final Report Preview -->
      <div class="panel preview-panel">
        <div class="panel-title">Final Report</div>
        <div class="preview-box" id="previewBox">
          <!-- Placeholder shown before preview loads -->
          <div class="preview-placeholder" id="previewPlaceholder">
            <svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="#aab8c4" stroke-width="1.5">
              <rect x="3" y="3" width="18" height="18" rx="2"/>
              <line x1="3" y1="9" x2="21" y2="9"/>
              <line x1="9" y1="21" x2="9" y2="9"/>
            </svg>
            Preview will appear here after generating the report
          </div>
        </div>
      </div>

    </div>

    <!-- Action Buttons -->
    <div class="action-bar">
      
      <button class="btn-action" onclick="exportPDF()">Export PDF</button>
      <button class="btn-action" onclick="exportExcel()">Export Excel</button>
    </div>

  </div>

  <script>
    function toggleBox() {
      const element = document.getElementById('myBox');
      const label = document.getElementById('hnLabel');

      if (element.style.display === 'none') {
        element.style.display = 'grid'; // แสดง
        label.classList.add('open');
      } else {
        element.style.display = 'none';  // ซ่อน
        label.classList.remove('open');
      }
    }

    const API_BASE = '/api';

    // Read URL params
    const params  = new URLSearchParams(window.location.search);
    const company = params.get("company") || "Client";
    const plant   = params.get("plant")   || "";
    const pkg     = params.get("package") || "";
    const service = params.get("service") || "";

    // Prefix used to browse files already recorded under QAQC Step ▸ Maintenance Record
    const CONTEXT_BASE = [params.get("company") || "", plant, service, pkg].filter(Boolean).join('/');
    const CONTEXT_PREFIX = CONTEXT_BASE ? CONTEXT_BASE + '/' : '';

    const REPORT_TYPE_FOLDER = {
      maintenance:  'MaintenanceReport',
      inspection:   'InspectionReport',
      sparepart:    'SparePartReport',
      photographer: 'PhotographerReport',
    };

    // Breadcrumb
    document.getElementById("breadcrumb").innerHTML = `
      <a href="Main.html">Home</a> &gt;
      <a href="Plant Selection.html?plant=${encodeURIComponent(company)}">${company}</a>
      ${plant ? ` &gt; <a href="Service.html?company=${encodeURIComponent(company)}&plant=${encodeURIComponent(plant)}">${decodeURIComponent(plant)}</a>` : ""}
      ${service ? ` &gt; <a href="Package Selection.html?company=${encodeURIComponent(company)}&plant=${encodeURIComponent(plant)}&service=${encodeURIComponent(service)}">${decodeURIComponent(service)}</a>` : ""}
      ${pkg ? ` &gt; <a href="Package Default.html?company=${encodeURIComponent(company)}&plant=${encodeURIComponent(plant)}&service=${encodeURIComponent(service)}&package=${encodeURIComponent(pkg)}">${decodeURIComponent(pkg)}</a>` : ""}
       &gt; Report Management
    `;

    // Populate Project dropdown from API (optional)
    async function loadProjects() {
      try {
        const res = await fetch(`${API_BASE}/list-paths?prefix=${encodeURIComponent(company)}`);
        const { folders } = await res.json();
        const sel = document.getElementById("filterProject");
        folders.forEach(f => {
          const opt = document.createElement("option");
          opt.value = f;
          opt.textContent = f;
          sel.appendChild(opt);
        });
        // Pre-select current plant if available
        if (plant) sel.value = decodeURIComponent(plant);
      } catch(e) {
        console.warn("Could not load projects:", e);
      }
    }

    function handleSearch() {
      const project   = document.getElementById("filterProject").value;
      const date      = document.getElementById("filterDate").value;
      const equipment = document.getElementById("filterEquipment").value;
      const status    = document.getElementById("filterStatus").value;
      console.log("Search:", { project, date, equipment, status });
      // TODO: wire to real search API
    }

    function toggleRecordList() {
      const list  = document.getElementById('mrList');
      const label = document.getElementById('mrToggle');
      list.classList.toggle('open');
      label.classList.toggle('open');
    }

    // Which report-type file lists have already been fetched (lazy-load once per group)
    const loadedFileGroups = new Set();

    async function toggleFileGroup(key, evt) {
      const row  = evt.currentTarget;
      const list = document.getElementById(`files-${key}`);
      const open = row.classList.toggle('open');
      list.classList.toggle('open', open);
      if (open && !loadedFileGroups.has(key)) {
        loadedFileGroups.add(key);
        await loadReportFiles(key);
      }
    }

    async function loadReportFiles(key) {
      const list = document.getElementById(`files-${key}`);
      list.innerHTML = '<div class="file-loading">กำลังโหลด...</div>';
      const dest = `${CONTEXT_PREFIX}QAQCStep/MaintenanceRecord/${REPORT_TYPE_FOLDER[key]}/`;
      try {
        const res = await fetch(`${API_BASE}/browse?prefix=${encodeURIComponent(dest)}`);
        if (!res.ok) throw new Error(res.status);
        const { files } = await res.json();
        list.innerHTML = '';
        if (!files || files.length === 0) {
          list.innerHTML = '<div class="file-empty">ยังไม่มีไฟล์ในโฟลเดอร์นี้</div>';
          return;
        }
        files.forEach((f, i) => {
          const row = document.createElement('div');
          row.className = 'file-row';

          const cb = document.createElement('input');
          cb.type = 'checkbox';
          cb.id = `file-${key}-${i}`;
          cb.dataset.objectName = f.object_name;

          const name = document.createElement('label');
          name.className = 'file-name';
          name.htmlFor = cb.id;
          name.textContent = f.name;
          name.title = 'เปิดไฟล์';
          name.onclick = e => {
            e.preventDefault(); // don't toggle the checkbox — open the file instead
            window.open(`Editor.html?object_name=${encodeURIComponent(f.object_name)}&return_url=${encodeURIComponent(location.pathname + location.search)}`, '_blank');
          };

          row.append(cb, name);

          if (f.last_modified) {
            const date = document.createElement('span');
            date.className = 'file-date';
            date.textContent = new Date(f.last_modified).toLocaleDateString('th-TH');
            row.appendChild(date);
          }

          list.appendChild(row);
        });
      } catch {
        list.innerHTML = '<div class="file-empty">⚠️ โหลดไฟล์ไม่สำเร็จ</div>';
      }
    }

    function generateReport() {
      const selectedFiles = Array.from(document.querySelectorAll('.file-row input[type="checkbox"]:checked'))
        .map(cb => cb.nextElementSibling.textContent);

      if (selectedFiles.length === 0) {
        alert("Please select at least one file.");
        return;
      }

      // Show simple preview placeholder text
      const box = document.getElementById("previewBox");
      box.innerHTML = `
