<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>PTTGC | QAQC ONLINE APPLICATION</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(to bottom right, #f0f8ff, #eaf2f8);
      min-height: 100vh;
      /* padding: 0 20px 40px; */
    }

    .header {
      background: linear-gradient(to right, #d6eaf8, #aed6f1);
      padding: 28px 40px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .logo-container {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
    }

    .logo {
      height: 50px;
      margin-bottom: 4px;
    }

    .company-name {
      font-size: 13px;
      font-style: italic;
      color: #2c3e50;
    }

    .center-title {
      flex: 1;
      text-align: center;
      font-size: 28px;
      font-weight: bold;
      color: #154360;
    }

    /* HEADER NAV (right side inside header) */
    .header-nav {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      width: 360px;
      flex-shrink: 0;
      min-width: 0;
    }

    .hn-label {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      font-weight: 600;
      color: #154360;
      cursor: pointer;
      padding: 7px 16px;
      background: rgba(255, 255, 255, 0.55);
      border: 1px solid rgba(255, 255, 255, 0.85);
      border-radius: 20px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.08);
      transition: background 0.2s, box-shadow 0.2s;
      user-select: none;
    }

    .hn-label:hover {
      background: rgba(255, 255, 255, 0.85);
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.12);
    }

    .hn-label .hn-arrow {
      font-size: 10px;
      transition: transform 0.25s;
    }

    .hn-label.open .hn-arrow {
      transform: rotate(180deg);
    }

    .hn-grid {
      position: absolute;
      top: calc(100% + 10px);
      right: 0;
      z-index: 20;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      width: 100%;
      padding: 10px;
      background: rgba(255, 255, 255, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.85);
      border-radius: 12px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.18);
    }

    .hn-item {
      display: flex;
      align-items: center;
      gap: 3px;
      min-width: 0;
    }

    .hn-btn {
      flex: 1;
      min-width: 0;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 8px 10px;
      background: rgba(255, 255, 255, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.9);
      border-radius: 8px;
      color: #154360;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, transform 0.15s, box-shadow 0.2s;
      overflow: hidden;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    .hn-btn:hover {
      background: #ffffff;
      transform: translateY(-2px);
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.12);
    }

    .hn-btn .btn-icon {
      font-size: 14px;
      flex-shrink: 0;
    }

    .hn-btn .btn-text {
      white-space: nowrap;
      min-width: 0;
    }

    @media (max-width: 900px) {
      .header-nav { display: none; }
    }

    .content {
      max-width: 900px;
      margin: 30px auto;
      text-align: center;
    }

    .button-list {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 20px;
      margin-top: 40px;
    }

    .custom-button {
      background: linear-gradient(to right, #5dade2, #3498db);
      color: white;
      padding: 30px 20px;
      font-size: 20px;
      border: none;
      border-radius: 14px;
      min-width: 180px;
      cursor: pointer;
      position: relative;
      box-shadow: 0 6px 12px rgba(0,0,0,0.15);
      transition: transform 0.2s;
    }

    .custom-button:hover {
      transform: translateY(-4px);
    }

    .button-actions {
      position: absolute;
      top: 5px;
      right: 8px;
      display: flex;
      gap: 5px;
    }

    .action-btn {
      background: rgba(255, 255, 255, 0.7);
      border: none;
      padding: 2px 6px;
      font-size: 12px;
      border-radius: 4px;
      cursor: pointer;
    }

    .add-btn {
      background-color: #27ae60;
      color: white;
      padding: 15px 30px;
      font-size: 20px;
      border: none;
      border-radius: 14px;
      margin-top: 30px;
      cursor: pointer;
      box-shadow: 0 6px 12px rgba(0,0,0,0.1);
    }

    .add-btn:hover {
      background-color: #219150;
    }

    input.rename-input {
      font-size: 16px;
      border: none;
      border-radius: 6px;
      padding: 4px 8px;
      text-align: center;
      width: 90%;
    }

    /* Modal Styles */
    .modal {
      display: none;
      position: fixed;
      z-index: 100;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      overflow: auto;
      background-color: rgba(0, 0, 0, 0.4);
    }

    .modal-content {
      background-color: #fff;
      margin: 15% auto;
      padding: 20px 30px;
      border-radius: 12px;
      width: 300px;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
    }

    .modal input {
      width: 100%;
      padding: 10px;
      font-size: 16px;
      margin: 15px 0;
    }

    .modal button {
      padding: 10px 20px;
      font-size: 16px;
      margin: 5px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }

    .btn-confirm {
      background-color: #3498db;
      color: white;
    }

    .btn-cancel {
      background-color: #ccc;
      color: #333;
    }
  </style>
</head>
<body>

  <!-- Header -->
  <div class="header">
    <div class="logo-container">
      <img src="GCME_Logo.png" alt="Company Logo" class="logo">
      <div class="company-name">GC Maintenance and Engineering Co.,LTD.</div>
    </div>
    <div class="center-title">QAQC ONLINE APPLICATION</div>

    <!-- Navigation (inside header, right side) -->
    <div class="header-nav">
      <div class="hn-label" id="hnLabel" onclick="toggleBox()">
        <span>General Form</span>
        <span class="hn-arrow">▾</span>
      </div>
      <div id="myBox" class="hn-grid" style="display: none;">
        <div class="hn-item">
          <button class="hn-btn" onclick="location.href='MaintenanceReport.html'">
            <span class="btn-icon">🔧</span>
            <span class="btn-text">Maintenance Report</span>
          </button>
        </div>
        <div class="hn-item">
          <button class="hn-btn" onclick="location.href='InspectionReport.html'">
            <span class="btn-icon">🔍</span>
            <span class="btn-text">Inspection Report</span>
          </button>
        </div>
        <div class="hn-item">
          <button class="hn-btn" onclick="location.href='SparePartReport.html'">
            <span class="btn-icon">⚙️</span>
            <span class="btn-text">Spare Part Report</span>
          </button>
        </div>
        <div class="hn-item">
          <button class="hn-btn" onclick="location.href='PhotographerReport.html'">
            <span class="btn-icon">📷</span>
            <span class="btn-text">Photographer Report</span>
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Main Content -->
  <div class="content">
    <div style="text-align: left; margin-bottom: 20px; font-size: 14px; color: #34495e;">
      <a href="Main.html" style="text-decoration: none; color: #2980b9;">Home</a> &gt;
      <a id="breadcrumb-company" href="#" style="text-decoration: none; color: #2980b9;"></a> &gt;
      <a id="breadcrumb-plant" href="#" style="text-decoration: none; color: #2980b9;"></a> &gt;
      <span id="breadcrumb-service"></span>
    </div>

    <h2>Package Selection for <span id="plant-name">...</span></h2>

    <div class="button-list" id="buttonList">
      <!-- Dynamic buttons -->
    </div>
    <button class="add-btn" onclick="showModal()">+ Add Package</button>
  </div>

  <!-- Modal Input -->
  <div id="addModal" class="modal">
    <div class="modal-content">
      <h3>Enter Package Name</h3>
      <input type="text" id="newButtonLabel" placeholder="Please Fill-in your Package">
      <div>
        <button class="btn-confirm" onclick="createButton()">Create</button>
        <button class="btn-cancel" onclick="closeModal()">Cancel</button>
      </div>
    </div>
  </div>

  <!-- Script -->
  <script>
    const API_BASE = '/api';
    const buttonList = document.getElementById("buttonList");
    const modal = document.getElementById("addModal");
    const input = document.getElementById("newButtonLabel");

    // ดึง company และ plant จาก URL
    const urlParams = new URLSearchParams(window.location.search);
    const company = urlParams.get("company") || "";
    const plant   = urlParams.get("plant")   || "";
    const service = urlParams.get("service") || "";

    if (plant) {
      document.getElementById("plant-name").textContent = plant;

      const companyLink = document.getElementById("breadcrumb-company");
      companyLink.textContent = company || "Plant Selection";
      companyLink.href = `Plant Selection.html?plant=${encodeURIComponent(company)}`;

      const plantLink = document.getElementById("breadcrumb-plant");
      plantLink.textContent = plant;
      plantLink.href = `Service.html?company=${encodeURIComponent(company)}&plant=${encodeURIComponent(plant)}`;

      document.getElementById("breadcrumb-service").textContent = service;
    }

    async function ensurePath(path) {
      try {
        await fetch(`${API_BASE}/ensure-path`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ path })
        });
      } catch (e) {
        console.warn('ensurePath failed:', path, e);
      }
    }

    async function deletePath(path) {
      try {
        await fetch(`${API_BASE}/delete-path?path=${encodeURIComponent(path)}`, {
          method: 'DELETE'
        });
      } catch (e) {
        console.warn('deletePath failed:', path, e);
      }
    }

    async function renamePath(oldPath, newPath, onFail) {
      try {
        const res = await fetch(`${API_BASE}/rename-path`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ old_path: oldPath, new_path: newPath })
        });
        if (!res.ok) {
          console.warn('renamePath server error:', res.status);
          if (onFail) onFail();
        }
      } catch (e) {
        console.warn('renamePath failed:', oldPath, '->', newPath, e);
        if (onFail) onFail();
      }
    }

    // โหลดเฉพาะ package ที่มีจริงใน MinIO
    (async () => {
      if (!company || !plant) return;
      ensurePath(`${company}/${plant}/${service}/`);
      try {
        const res = await fetch(`${API_BASE}/list-paths?prefix=${encodeURIComponent(company + '/' + plant + '/' + service)}`);
        const { folders } = await res.json();
        folders.forEach(label => addNewButton(label));
      } catch (e) {
        console.warn("ไม่สามารถโหลด folder จาก MinIO:", e);
      }
    })();

    function toggleBox() {
      const element = document.getElementById('myBox');
      const label = document.getElementById('hnLabel');

      if (element.style.display === 'none') {
        element.style.display = 'grid'; // แสดง
        label.classList.add('open');
      } else {
        element.style.display = 'none';  // ซ่อน
        label.classList.remove('open');
      }
    }

    function showModal() {
      modal.style.display = "block";
      input.value = "";
      input.focus();
    }

    function closeModal() {
      modal.style.display = "none";
    }

    window.onclick = function(event) {
      if (event.target == modal) closeModal();
    }

    async function createButton() {
      const label = input.value.trim();
      if (!label) {
        alert("Please enter a button name.");
        return;
      }
      addNewButton(label);
      closeModal();

      if (company && plant) {
        const base = `${company}/${plant}/${service}/${label}`;
        await Promise.all([
          ensurePath(`${base}/Data/`),
          ensurePath(`${base}/Progress/`),
          ensurePath(`${base}/QAQC_Step/`),
          ensurePath(`${base}/Report/`),
        ]);
      }
    }

    function addNewButton(label = "New Button") {
      let currentLabel = label;

      const wrapper = document.createElement("div");
      wrapper.className = "custom-button";

      const span = document.createElement("span");
      span.textContent = currentLabel;

      wrapper.onclick = () => {
        const params = new URLSearchParams({
          company,
          plant,
          service,
          package: currentLabel
        });
        window.location.href = `Package Default.html?${params.toString()}`;
      };

      const actions = document.createElement("div");
      actions.className = "button-actions";

      const editBtn = document.createElement("button");
      editBtn.className = "action-btn";
      editBtn.innerHTML = "✏️";
      editBtn.onclick = (event) => {
        event.stopPropagation();
        renameButton(span, actions, editBtn, deleteBtn, async (newLabel, revertFn) => {
          if (!newLabel || newLabel === currentLabel) return;
          const oldLabel = currentLabel;
          currentLabel = newLabel;
          if (company && plant) {
            await renamePath(
              `${company}/${plant}/${service}/${oldLabel}`,
              `${company}/${plant}/${service}/${newLabel}`,
              () => {
                currentLabel = oldLabel;
                revertFn(oldLabel);
                alert(`ไม่สามารถเปลี่ยนชื่อเป็น "${newLabel}" ได้ กรุณาลองอีกครั้ง`);
              }
            );
          }
        });
      };

      const deleteBtn = document.createElement("button");
      deleteBtn.className = "action-btn";
      deleteBtn.innerHTML = "🗑️";
      deleteBtn.onclick = async (event) => {
        event.stopPropagation();
        if (!confirm(`ลบ "${currentLabel}" และทุกไฟล์ข้างในออกจาก MinIO?`)) return;
        await deletePath(`${company}/${plant}/${service}/${currentLabel}/`);
        wrapper.remove();
      };

      actions.appendChild(editBtn);
      actions.appendChild(deleteBtn);

      wrapper.appendChild(actions);
      wrapper.appendChild(span);
      buttonList.appendChild(wrapper);
    }

    function renameButton(span, actions, editBtn, deleteBtn, onRename) {
      const oldText = span.textContent;
      const inputEl = document.createElement("input");
      inputEl.className = "rename-input";
      inputEl.type = "text";
      inputEl.value = oldText;

      // swap ปุ่ม ✏️🗑️ → ✅❌
      const confirmBtn = document.createElement("button");
      confirmBtn.className = "action-btn";
      confirmBtn.innerHTML = "✅";
      confirmBtn.title = "Confirm";

      const cancelBtn = document.createElement("button");
      cancelBtn.className = "action-btn";
      cancelBtn.innerHTML = "❌";
      cancelBtn.title = "Cancel";

      actions.innerHTML = "";
      actions.appendChild(confirmBtn);
      actions.appendChild(cancelBtn);

      span.replaceWith(inputEl);
      inputEl.focus();

      function restoreActions() {
        actions.innerHTML = "";
        actions.appendChild(editBtn);
        actions.appendChild(deleteBtn);
      }

      async function doConfirm() {
        const newText = inputEl.value.trim() || oldText;
        const newSpan = document.createElement("span");
        newSpan.textContent = newText;
        inputEl.replaceWith(newSpan);
        restoreActions();
        if (newText !== oldText && onRename) {
          await onRename(newText, (revertText) => { newSpan.textContent = revertText; });
        }
      }

      function doCancel() {
        const newSpan = document.createElement("span");
        newSpan.textContent = oldText;
        inputEl.replaceWith(newSpan);
        restoreActions();
      }

      confirmBtn.onclick = (e) => { e.stopPropagation(); doConfirm(); };
      cancelBtn.onclick  = (e) => { e.stopPropagation(); doCancel(); };

      inputEl.onkeydown = (e) => {
        if (e.key === 'Enter')  { e.preventDefault(); doConfirm(); }
        if (e.key === 'Escape') { doCancel(); }
      };
    }
  </script>

</body>
</html>
