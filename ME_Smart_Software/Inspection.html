<!DOCTYPE html> 
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Component Part</title>

  <!-- Font Awesome สำหรับไอคอนบ้าน -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 30px;
      position: relative;
      min-height: 100vh;
      padding-bottom: 80px; /* space สำหรับปุ่ม home */
    }

    .container {
      display: flex;
      gap: 20px;
    }

    .dropdown {
      position: relative;
    }

    .dropdown-button {
      background-color: #4CAF50;
      color: white;
      padding: 12px 16px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 16px;
    }

    .dropdown-content {
      display: none;
      position: absolute;
      background-color: white;
      min-width: 160px;
      border: 1px solid #ccc;
      border-radius: 6px;
      box-shadow: 0 8px 16px rgba(0,0,0,0.2);
      z-index: 10;
    }

    .dropdown-content a {
      padding: 12px 16px;
      display: block;
      color: black;
      text-decoration: none;
      cursor: pointer;
    }

    .dropdown-content a:hover {
      background-color: #f1f1f1;
    }

    .dropdown:hover .dropdown-content {
      display: block;
    }

    .component-list {
      min-width: 300px;
      border: 1px solid #ccc;
      padding: 10px;
      border-radius: 6px;
      background-color: #f9f9f9;
    }

    .component-item {
      margin: 10px 0;
      padding: 10px;
      background-color: #e7f3e7;
      border-radius: 6px;
      cursor: pointer;
      position: relative;
    }

    .sub-options {
      margin-top: 10px;
      display: none;
    }

    .sub-options a {
      display: block;
      padding: 6px 10px;
      color: #333;
      text-decoration: none;
      font-size: 14px;
    }

    .sub-options a:hover {
      background-color: #ddd;
    }

    /* Modal */
    .modal {
      display: none;
      position: fixed;
      z-index: 99;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      overflow: auto;
      background-color: rgba(0,0,0,0.5);
    }

    .modal-content {
      background-color: white;
      margin: 10% auto;
      padding: 20px;
      border-radius: 8px;
      width: 400px;
    }

    .modal-content textarea {
      width: 100%;
      height: 150px;
      resize: vertical;
      margin-bottom: 15px;
    }

    .modal-content button {
      margin-right: 10px;
      padding: 6px 12px;
      font-size: 14px;
      cursor: pointer;
    }

    .btn-ok {
      background-color: #4CAF50;
      color: white;
      border: none;
      border-radius: 4px;
    }

    .btn-cancel {
      background-color: #ccc;
      border: none;
      border-radius: 4px;
    }

    /* ปุ่ม Home ตรงกลางล่าง */
    .home-button {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background-color: #4CAF50;
      color: white;
      border: none;
      padding: 12px 16px;
      border-radius: 50%;
      font-size: 20px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.2);
      cursor: pointer;
      z-index: 100;
      text-align: center;
    }

    .home-button:hover {
      background-color: #45a049;
    }
  </style>
</head>
<body>

<div class="container">
  <!-- Left: Component part menu -->
  <div class="dropdown">
    <button class="dropdown-button">Component part</button>
    <div class="dropdown-content">
      <a onclick="openAddModal()">Add</a>
      <a onclick="editComponent()">Edit</a>
      <a onclick="deleteComponent()">Delete</a>
    </div>
  </div>

  <!-- Right: Component list -->
  <div class="component-list" id="componentList">
    <h3>Component Items</h3>
  </div>
</div>

<!-- Modal for Add -->
<div class="modal" id="addModal">
  <div class="modal-content">
    <h3>Add Component Items</h3>
    <p>Enter each item name on a new line:</p>
    <textarea id="addItemsInput" placeholder="e.g. Bearing&#10;Shaft&#10;Seal"></textarea>
    <button class="btn-ok" onclick="confirmAdd()">OK</button>
    <button class="btn-cancel" onclick="closeAddModal()">Cancel</button>
  </div>
</div>

<!-- ปุ่ม Home -->
<a href="QAQC online.html" class="home-button" title="Back to Home">
  <i class="fas fa-home"></i>
</a>

<script>
  let components = [];

  function openAddModal() {
    document.getElementById("addModal").style.display = "block";
  }

  function closeAddModal() {
    document.getElementById("addModal").style.display = "none";
    document.getElementById("addItemsInput").value = "";
  }

  function confirmAdd() {
    const input = document.getElementById("addItemsInput").value.trim();
    if (input) {
      const items = input.split("\n").map(item => item.trim()).filter(item => item);
      components.push(...items);
      renderList();
    }
    closeAddModal();
  }

  function editComponent() {
    const index = prompt("Enter item number to edit:");
    if (index && components[index - 1]) {
      const newName = prompt("Enter new name:", components[index - 1]);
      if (newName) {
        components[index - 1] = newName;
        renderList();
      }
    }
  }

  function deleteComponent() {
    const index = prompt("Enter item number to delete:");
    if (index && components[index - 1]) {
      components.splice(index - 1, 1);
      renderList();
    }
  }

  function renderList() {
    const list = document.getElementById("componentList");
    list.innerHTML = "<h3>Component Items</h3>";
    components.forEach((item, i) => {
      const div = document.createElement("div");
      div.className = "component-item";
      div.innerHTML = `${i + 1}. ${item}
        <div class="sub-options" id="options-${i}">
          <a href="#">ITP check list</a>
          <a href="Inspection_Sheet.html?component=${encodeURIComponent(item)}" target="_blank">Inspection sheet</a>
          <a href="#">Special request</a>
        </div>`;
      div.onclick = () => toggleOptions(i);
      list.appendChild(div);
    });
  }

  function toggleOptions(index) {
    const all = document.querySelectorAll('.sub-options');
    all.forEach((el, i) => {
      el.style.display = (i === index && el.style.display !== "block") ? "block" : "none";
    });
  }

  // Close modal if clicked outside
  window.onclick = function(event) {
    const modal = document.getElementById("addModal");
    if (event.target === modal) {
      closeAddModal();
    }
  }
</script>

</body>
</html>
